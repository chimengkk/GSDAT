# general settings
name: GSDAT_test_X2
model_type: GSDATModel
scale: 2
num_gpu: auto
manual_seed: 1234

# dataset and data loader settings
datasets:
  test_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /home/projects/datasets/TestDataSR/HR/Set5/x2
    dataroot_lq: /home/projects/datasets/TestDataSR/LR/LRBI/Set5/x2
    io_backend:
      type: disk

  test_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /home/projects/datasets/TestDataSR/HR/Set14/x2
    dataroot_lq: /home/projects/datasets/TestDataSR/LR/LRBI/Set14/x2
    io_backend:
      type: disk

  test_3:
    name: BSD100
    type: PairedImageDataset
    dataroot_gt: /home/projects/datasets/TestDataSR/HR/BSD100/x2
    dataroot_lq: /home/projects/datasets/TestDataSR/LR/LRBI/BSD100/x2
    io_backend:
      type: disk

  test_4:
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: /home/projects/datasets/TestDataSR/HR/Urban100/x2
    dataroot_lq: /home/projects/datasets/TestDataSR/LR/LRBI/Urban100/x2
    io_backend:
      type: disk

  test_5:
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: /home/projects/datasets/TestDataSR/HR/Manga109/x2
    dataroot_lq: /home/projects/datasets/TestDataSR/LR/LRBI/Manga109/x2
    io_backend:
      type: disk


# network structures
network_g:
  type: GSDATNet
  upscale: 2
  in_chans: 3
  img_size: 64
  window_size: 8
  interval_size: 4
  img_range: 1.
  depths: [3, 3, 3, 3, 3, 3,]       # 列表长度代表 RHTB 的数量
  num_heads: [6, 6, 6, 6, 6, 6,]
  embed_dim: 60
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  param_key_g: 'params_ema'

# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

# tile settings
tile:
  tile_size: 256
  tile_pad: 32